openapi: 3.1.0
info:
  contact:
    email: projects@vfernandezg.dev
    name: Healthy Bites
  description: "API de Healthy Bites: seguimiento de hábitos y metas, planes de alimentació\
    n, contenido, recompensas y comunidad. Errores en formato RFC 9457 (ProblemDetail)."
  license:
    name: Uso privado
  title: Healthy Bites API
  version: v1
servers:
- url: http://localhost:8090/api/v1
security:
- bearer: []
tags:
- description: "Login, renovación, logout y restablecimiento de contraseña"
  name: Sesión
- description: "Catálogo de artículos, vídeos y guías"
  name: Contenido
- description: "Catálogo, detalle e inscripciones de los clientes"
  name: Planes de alimentación
- description: "Planes, checkout con PayPal y pagos del usuario"
  name: Suscripción
- description: "Metas, pesajes, hábitos y recomendación (solo clientes)"
  name: Progreso
- description: Formulario de contacto de la landing
  name: Contacto
- description: Rachas de los clientes y recompensas de los nutricionistas
  name: Recompensas
- description: Subida de imágenes y ficheros de contenido
  name: Ficheros
- description: "Búsqueda, resumen y activación de cuentas (solo ADMIN)"
  name: Admin · Cuentas
- description: "Suscripciones, pagos y resumen de ingresos (solo ADMIN)"
  name: Admin · Facturación
- description: "Artículos, vídeos y guías propios"
  name: Nutricionista · Contenido
- description: Alta de clientes y de nutricionistas invitados
  name: Registro
- description: Alta de nutricionistas por invitación (solo ADMIN)
  name: Admin · Invitaciones
- description: "Planes de alimentación propios, sus comidas y sus clientes"
  name: Nutricionista · Planes
paths:
  /admin/billing/summary:
    get:
      operationId: summary_1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BillingSummaryResponse"
          description: OK
      summary: "Suscripciones vigentes por nivel, ingreso mensual recurrente e ingresos\
        \ de 30 días"
      tags:
      - Admin · Facturación
  /admin/nutritionist-invitations:
    get:
      operationId: list
      parameters:
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelInvitationResponse"
          description: OK
      summary: Lista las invitaciones con su estado
      tags:
      - Admin · Invitaciones
    post:
      operationId: invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteNutritionistRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: OK
      summary: "Invita a un nutricionista: recibe un enlace por correo para crear\
        \ su cuenta"
      tags:
      - Admin · Invitaciones
  /admin/nutritionist-invitations/{id}:
    delete:
      operationId: revoke
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Revoca una invitación pendiente
      tags:
      - Admin · Invitaciones
  /admin/nutritionist-invitations/{id}/resend:
    post:
      operationId: resend
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: OK
      summary: Reenvía la invitación con un enlace nuevo (el anterior deja de valer)
      tags:
      - Admin · Invitaciones
  /admin/payments:
    get:
      operationId: payments_1
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - CREATED
          - CAPTURED
          - FAILED
          - CANCELED
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelAdminPaymentResponse"
          description: OK
      summary: Pagos por estado
      tags:
      - Admin · Facturación
  /admin/subscriptions:
    get:
      operationId: subscriptions
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - PENDING_PAYMENT
          - ACTIVE
          - CANCELED
          - EXPIRED
      - in: query
        name: tier
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - BASIC
          - PREMIUM
          - VIP
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelAdminSubscriptionResponse"
          description: OK
      summary: Suscripciones por estado y nivel
      tags:
      - Admin · Facturación
  /admin/users:
    get:
      operationId: search
      parameters:
      - in: query
        name: role
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - ADMIN
          - CLIENT
          - NUTRITIONIST
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - ACTIVE
          - DEACTIVATED
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelAdminUserResponse"
          description: OK
      summary: "Busca cuentas por rol, estado y texto (nombre o correo)"
      tags:
      - Admin · Cuentas
  /admin/users/summary:
    get:
      operationId: summary
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSummaryResponse"
          description: OK
      summary: Totales por rol y estado y altas de los últimos 30 días
      tags:
      - Admin · Cuentas
  /admin/users/{id}/activate:
    post:
      operationId: activate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
          description: OK
      summary: Reactiva una cuenta
      tags:
      - Admin · Cuentas
  /admin/users/{id}/deactivate:
    post:
      operationId: deactivate_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
          description: OK
      summary: Desactiva una cuenta y cierra sus sesiones
      tags:
      - Admin · Cuentas
  /auth/forgot-password:
    post:
      description: "Siempre 202, exista o no la cuenta: la respuesta no revela qué\
        \ correos están registrados."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
      security: []
      summary: Pide un enlace para restablecer la contraseña
      tags:
      - Sesión
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      security: []
      summary: "Acepta la invitación: crea la cuenta de nutricionista con su contraseñ\
        a"
      tags:
      - Registro
  /auth/invitations/preview:
    post:
      operationId: previewInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationPreviewRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponse"
          description: OK
      security: []
      summary: Datos de una invitación de nutricionista (para mostrarlos antes de
        aceptar)
      tags:
      - Registro
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
      security: []
      summary: "Abre una sesión: access token en el cuerpo y refresh token en una\
        \ cookie httpOnly"
      tags:
      - Sesión
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: OK
      security: []
      summary: "Cierra la sesión: revoca el refresh token y borra la cookie"
      tags:
      - Sesión
  /auth/refresh:
    post:
      operationId: refresh
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      security: []
      summary: "Renueva la sesión con la cookie del refresh token, que se rota en\
        \ cada uso"
      tags:
      - Sesión
  /auth/register:
    post:
      description: "Crea la cuenta y su perfil. Para entrar, el web-app inicia sesió\
        n con las mismas credenciales."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      security: []
      summary: Registro público de clientes
      tags:
      - Registro
  /auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
      security: []
      summary: Cambia la contraseña con el token del enlace y cierra todas las sesiones
        del usuario
      tags:
      - Sesión
  /contact:
    post:
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessage"
        required: true
      responses:
        "200":
          description: OK
      security: []
      summary: "Envía un mensaje al equipo (204, 422, 429 o 503)"
      tags:
      - Contacto
  /content-items:
    get:
      operationId: catalog_2
      parameters:
      - in: query
        name: type
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - ARTICLE
          - VIDEO
          - GUIDE
      - in: query
        name: category
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - NUTRITION
          - EXERCISE
          - MENTAL_HEALTH
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelContentSummaryResponse"
          description: OK
      summary: "Contenido publicado, con filtros; locked indica si el usuario no puede\
        \ abrirlo"
      tags:
      - Contenido
  /content-items/{id}/file:
    get:
      operationId: file
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FileLinkResponse"
          description: OK
      summary: "Enlace firmado y temporal al fichero del contenido (vídeo, PDF...)"
      tags:
      - Contenido
  /content-items/{slug}:
    get:
      operationId: detail_1
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContentDetailResponse"
          description: OK
      summary: "Detalle con el cuerpo (403 subscription-required, con requiredTier,\
        \ si está bloqueado)"
      tags:
      - Contenido
  /me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: Usuario actual con el perfil de su rol
      tags:
      - Mi cuenta
  /me/content-unlocks:
    get:
      operationId: unlocked
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentSummaryResponse"
          description: OK
      summary: Contenido que he desbloqueado
      tags:
      - Contenido
  /me/goals:
    get:
      operationId: goals
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - ACTIVE
          - COMPLETED
          - ABANDONED
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalResponse"
          description: OK
      tags:
      - Progreso
    post:
      operationId: createGoal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalResponse"
          description: OK
      summary: Crea una meta (solo puede haber una activa)
      tags:
      - Progreso
  /me/goals/{id}:
    get:
      operationId: goal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalResponse"
          description: OK
      tags:
      - Progreso
    put:
      operationId: updateGoal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalResponse"
          description: OK
      tags:
      - Progreso
  /me/goals/{id}/abandon:
    post:
      operationId: abandon
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalResponse"
          description: OK
      tags:
      - Progreso
  /me/goals/{id}/complete:
    post:
      operationId: complete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalResponse"
          description: OK
      tags:
      - Progreso
  /me/goals/{id}/recommendation:
    get:
      operationId: recommendation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
          description: OK
      summary: Rango de peso saludable para tu altura y estimación del tiempo hasta
        el objetivo
      tags:
      - Progreso
  /me/goals/{id}/status-history:
    get:
      operationId: history
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusChangeResponse"
          description: OK
      tags:
      - Progreso
  /me/goals/{id}/weight-entries:
    get:
      operationId: weights
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        required: false
        schema:
          type:
          - string
          - "null"
          format: date
      - in: query
        name: to
        required: false
        schema:
          type:
          - string
          - "null"
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightEntryResponse"
          description: OK
      summary: "Pesajes de la meta en un rango de fechas (todos si no hay rango),\
        \ del más antiguo al último"
      tags:
      - Progreso
    post:
      operationId: addWeight
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WeightEntryResponse"
          description: OK
      tags:
      - Progreso
  /me/goals/{id}/weight-entries/{entryId}:
    delete:
      operationId: deleteWeight
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      tags:
      - Progreso
    put:
      operationId: updateWeight
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightEntryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WeightEntryResponse"
          description: OK
      tags:
      - Progreso
  /me/habit-logs:
    get:
      operationId: habitLogs
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type:
          - string
          - "null"
          format: date
      - in: query
        name: to
        required: false
        schema:
          type:
          - string
          - "null"
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitLogResponse"
          description: OK
      summary: "Registros de hábitos en un rango (por defecto, los últimos 30 días)"
      tags:
      - Progreso
    post:
      operationId: logHabits
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitLogRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitLogResponse"
          description: OK
      summary: Registra los hábitos de hoy (o de ayer); cuenta para las rachas
      tags:
      - Progreso
  /me/habit-logs/{id}:
    delete:
      operationId: deleteHabits
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      tags:
      - Progreso
    put:
      operationId: updateHabits
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitLogRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitLogResponse"
          description: OK
      tags:
      - Progreso
  /me/meal-plan-enrollments:
    get:
      operationId: enrollments
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentResponse"
          description: OK
      summary: Planes que sigo
      tags:
      - Planes de alimentación
    post:
      operationId: enroll
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
        required: true
      responses:
        "200":
          description: OK
      summary: Empiezo a seguir un plan (hay que poder abrirlo)
      tags:
      - Planes de alimentación
  /me/meal-plan-enrollments/{mealPlanId}:
    delete:
      operationId: unenroll
      parameters:
      - in: path
        name: mealPlanId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Dejo de seguir un plan (los desbloqueados con una recompensa se conservan)
      tags:
      - Planes de alimentación
  /me/password:
    put:
      description: Cierra todas las sesiones (también en otros dispositivos) y devuelve
        una nueva.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
      summary: Cambia la contraseña
      tags:
      - Mi cuenta
  /me/payments:
    get:
      operationId: payments
      parameters:
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelPaymentResponse"
          description: OK
      summary: Pagos del usuario
      tags:
      - Suscripción
  /me/profile:
    put:
      operationId: update_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: Actualiza el nombre y los datos del perfil
      tags:
      - Mi cuenta
  /me/streaks:
    get:
      operationId: streaks
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
