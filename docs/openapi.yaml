openapi: 3.1.0
info:
  contact:
    email: projects@vfernandezg.dev
    name: Healthy Bites
  description: "API de Healthy Bites: seguimiento de hábitos y metas, planes de alimentació\
    n, contenido, recompensas y comunidad. Errores en formato RFC 9457 (ProblemDetail)."
  license:
    name: Uso privado
  title: Healthy Bites API
  version: v1
servers:
- url: http://localhost:8090/api/v1
security:
- bearer: []
tags:
- description: Subida de imágenes y ficheros de contenido
  name: Ficheros
- description: "Login, renovación, logout y restablecimiento de contraseña"
  name: Sesión
- description: "Búsqueda, resumen y activación de cuentas (solo ADMIN)"
  name: Admin · Cuentas
- description: Alta de clientes y de nutricionistas invitados
  name: Registro
- description: Alta de nutricionistas por invitación (solo ADMIN)
  name: Admin · Invitaciones
- description: Formulario de contacto de la landing
  name: Contacto
paths:
  /admin/nutritionist-invitations:
    get:
      operationId: list
      parameters:
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelInvitationResponse"
          description: OK
      summary: Lista las invitaciones con su estado
      tags:
      - Admin · Invitaciones
    post:
      operationId: invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteNutritionistRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: OK
      summary: "Invita a un nutricionista: recibe un enlace por correo para crear\
        \ su cuenta"
      tags:
      - Admin · Invitaciones
  /admin/nutritionist-invitations/{id}:
    delete:
      operationId: revoke
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Revoca una invitación pendiente
      tags:
      - Admin · Invitaciones
  /admin/nutritionist-invitations/{id}/resend:
    post:
      operationId: resend
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: OK
      summary: Reenvía la invitación con un enlace nuevo (el anterior deja de valer)
      tags:
      - Admin · Invitaciones
  /admin/users:
    get:
      operationId: search
      parameters:
      - in: query
        name: role
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - ADMIN
          - CLIENT
          - NUTRITIONIST
      - in: query
        name: status
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - ACTIVE
          - DEACTIVATED
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelAdminUserResponse"
          description: OK
      summary: "Busca cuentas por rol, estado y texto (nombre o correo)"
      tags:
      - Admin · Cuentas
  /admin/users/summary:
    get:
      operationId: summary
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSummaryResponse"
          description: OK
      summary: Totales por rol y estado y altas de los últimos 30 días
      tags:
      - Admin · Cuentas
  /admin/users/{id}/activate:
    post:
      operationId: activate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
          description: OK
      summary: Reactiva una cuenta
      tags:
      - Admin · Cuentas
  /admin/users/{id}/deactivate:
    post:
      operationId: deactivate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
          description: OK
      summary: Desactiva una cuenta y cierra sus sesiones
      tags:
      - Admin · Cuentas
  /auth/forgot-password:
    post:
      description: "Siempre 202, exista o no la cuenta: la respuesta no revela qué\
        \ correos están registrados."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
      security: []
      summary: Pide un enlace para restablecer la contraseña
      tags:
      - Sesión
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      security: []
      summary: "Acepta la invitación: crea la cuenta de nutricionista con su contraseñ\
        a"
      tags:
      - Registro
  /auth/invitations/preview:
    post:
      operationId: previewInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationPreviewRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponse"
          description: OK
      security: []
      summary: Datos de una invitación de nutricionista (para mostrarlos antes de
        aceptar)
      tags:
      - Registro
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
      security: []
      summary: "Abre una sesión: access token en el cuerpo y refresh token en una\
        \ cookie httpOnly"
      tags:
      - Sesión
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: OK
      security: []
      summary: "Cierra la sesión: revoca el refresh token y borra la cookie"
      tags:
      - Sesión
  /auth/refresh:
    post:
      operationId: refresh
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      security: []
      summary: "Renueva la sesión con la cookie del refresh token, que se rota en\
        \ cada uso"
      tags:
      - Sesión
  /auth/register:
    post:
      description: "Crea la cuenta y su perfil. Para entrar, el web-app inicia sesió\
        n con las mismas credenciales."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      security: []
      summary: Registro público de clientes
      tags:
      - Registro
  /auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
      security: []
      summary: Cambia la contraseña con el token del enlace y cierra todas las sesiones
        del usuario
      tags:
      - Sesión
  /contact:
    post:
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessage"
        required: true
      responses:
        "200":
          description: OK
      security: []
      summary: "Envía un mensaje al equipo (204, 422, 429 o 503)"
      tags:
      - Contacto
  /me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: Usuario actual con el perfil de su rol
      tags:
      - Mi cuenta
  /me/password:
    put:
      description: Cierra todas las sesiones (también en otros dispositivos) y devuelve
        una nueva.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
      summary: Cambia la contraseña
      tags:
      - Mi cuenta
  /me/profile:
    put:
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
      summary: Actualiza el nombre y los datos del perfil
      tags:
      - Mi cuenta
  /media:
    post:
      description: "El tipo se detecta por su contenido. POST_IMAGE: cualquier usuario,\
        \ solo imágenes. CONTENT_COVER y CONTENT_FILE: nutricionistas. Los CONTENT_FILE\
        \ no tienen ruta pública: se abren desde el contenido."
      operationId: upload
      parameters:
      - in: query
        name: purpose
        required: true
        schema:
          type: string
          enum:
          - POST_IMAGE
          - CONTENT_COVER
          - CONTENT_FILE
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: OK
      summary: Sube un fichero
      tags:
      - Ficheros
  /media/{id}:
    get:
      operationId: read
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: expires
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
      - in: query
        name: signature
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
      security: []
      summary: "Lee un fichero: los públicos por id; los protegidos, solo con su URL\
        \ firmada"
      tags:
      - Ficheros
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        bio:
          type: string
          maxLength: 2000
          minLength: 0
        password:
          type: string
          maxLength: 64
          minLength: 10
        token:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - password
      - token
    AdminUserResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        firstName:
          type: string
        id:
          type: string
          format: uuid
        lastLoginAt:
          type: string
          format: date-time
        lastName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - CLIENT
          - NUTRITIONIST
        status:
          type: string
          enum:
          - ACTIVE
          - DEACTIVATED
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
          minLength: 0
        newPassword:
          type: string
          maxLength: 64
          minLength: 10
      required:
      - currentPassword
      - newPassword
    ClientData:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        heightCm:
          type: number
          maximum: 260
          minimum: 50
        sex:
          type: string
          enum:
          - FEMALE
          - MALE
          - OTHER
        weightKg:
          type: number
          maximum: 400
          minimum: 20
    ClientProfileResponse:
      type: object
      properties:
        age:
          type: integer
          format: int32
        birthDate:
          type: string
          format: date
        heightCm:
          type: number
        sex:
          type: string
          enum:
          - FEMALE
          - MALE
          - OTHER
        weightKg:
          type: number
    ContactMessage:
      type: object
      properties:
        apellido:
          type: string
          maxLength: 60
          minLength: 2
        correo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        mensaje:
          type: string
          maxLength: 2000
          minLength: 10
        nombre:
          type: string
          maxLength: 60
          minLength: 2
        website:
          type: string
      required:
      - apellido
      - correo
      - mensaje
      - nombre
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - email
    InvitationPreviewRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - token
    InvitationPreviewResponse:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    InvitationResponse:
      type: object
      properties:
        acceptedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        expiresAt:
          type: string
          format: date-time
        firstName:
          type: string
        id:
          type: string
          format: uuid
        lastName:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
    InviteNutritionistRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        firstName:
          type: string
          maxLength: 60
          minLength: 0
        lastName:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - email
      - firstName
      - lastName
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    MeResponse:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/ClientProfileResponse"
        email:
          type: string
        firstName:
          type: string
        id:
          type: string
          format: uuid
        lastName:
          type: string
        nutritionist:
          $ref: "#/components/schemas/NutritionistProfileResponse"
        role:
          type: string
          enum:
          - ADMIN
          - CLIENT
          - NUTRITIONIST
    NutritionistProfileResponse:
      type: object
      properties:
        bio:
          type: string
    PageMetadata:
      type: object
      properties:
        number:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
      required:
      - number
      - size
      - totalElements
      - totalPages
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PagedModelAdminUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
      - content
      - page
    PagedModelInvitationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/InvitationResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
      - content
      - page
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        firstName:
          type: string
          maxLength: 60
          minLength: 0
        lastName:
          type: string
          maxLength: 60
          minLength: 0
        password:
          type: string
          maxLength: 64
          minLength: 10
        profile:
          $ref: "#/components/schemas/ClientData"
      required:
      - email
      - firstName
      - lastName
      - password
    ResetPasswordRequest:
      type: object
      properties:
        password:
          type: string
          maxLength: 64
          minLength: 10
        token:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - password
      - token
    SessionResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/SessionUser"
    SessionUser:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
        id:
          type: string
          format: uuid
        lastName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - CLIENT
          - NUTRITIONIST
    UpdateProfileRequest:
      type: object
      properties:
        bio:
          type: string
          maxLength: 2000
          minLength: 0
        client:
          $ref: "#/components/schemas/ClientData"
        firstName:
          type: string
          maxLength: 60
          minLength: 0
        lastName:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - firstName
      - lastName
    UploadResponse:
      type: object
      properties:
        contentType:
          type: string
        id:
          type: string
          format: uuid
        path:
          type: string
        sizeBytes:
          type: integer
          format: int64
    UserSummaryResponse:
      type: object
      properties:
        active:
          type: integer
          format: int64
        byRole:
          type: object
          additionalProperties:
            type: integer
            format: int64
        deactivated:
          type: integer
          format: int64
        newLast30Days:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token de POST /auth/login o /auth/refresh
      scheme: bearer
      type: http
