components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        bio:
          type: string
          maxLength: 2000
          minLength: 0
        password:
          type: string
          maxLength: 64
          minLength: 10
        token:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - password
      - token
    AdminPaymentResponse:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        providerOrderId:
          type: string
        status:
          type: string
          enum:
          - CREATED
          - CAPTURED
          - FAILED
          - CANCELED
        subscriptionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    AdminSubscriptionResponse:
      type: object
      properties:
        canceledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        currentPeriodStart:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - ACTIVE
          - CANCELED
          - EXPIRED
        tier:
          type: string
          enum:
          - BASIC
          - PREMIUM
          - VIP
        userId:
          type: string
          format: uuid
    AdminUserResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        firstName:
          type: string
        id:
          type: string
          format: uuid
        lastLoginAt:
          type: string
          format: date-time
        lastName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - CLIENT
          - NUTRITIONIST
        status:
          type: string
          enum:
          - ACTIVE
          - DEACTIVATED
    AuthorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
