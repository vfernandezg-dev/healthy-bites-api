# Base de datos local para Healthy Bites.
#   Levantar:  docker compose up -d
#   Parar:     docker compose down        (conserva los datos)
#   Resetear:  docker compose down -v     (borra el volumen; el seed se vuelve a cargar al arrancar el backend)
# Se publica en 5433 porque 5432 suele estar ocupado por un PostgreSQL instalado en Windows.
services:
  db:
    image: postgres:18-alpine
    container_name: healthybites-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthybites-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminadmin
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos en /var/lib/postgresql/<versión>/docker:
      # el volumen se monta en /var/lib/postgresql. Es un volumen nuevo porque los datos de la 16
      # no son compatibles con la 18 (el seed los recrea al arrancar el backend).
      - healthybites-pgdata-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthybites-db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthybites-pgdata-18:
