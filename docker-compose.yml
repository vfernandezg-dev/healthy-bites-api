# Servicios locales de Healthy Bites: PostgreSQL y Mailpit (y un S3 de pruebas opcional, perfil s3).
#
# `./mvnw spring-boot:run` los levanta solo (spring-boot-docker-compose) y conecta la BD automáticamente.
# A mano:
#   Levantar:  docker compose up -d
#   Parar:     docker compose down        (conserva los datos)
#   Resetear:  docker compose down -v     (borra el volumen; el seed se vuelve a cargar al arrancar el backend)
#
# Las variables (DB_PASSWORD) se leen de .env (ver .env.example). Todo se publica solo en 127.0.0.1.
services:
  db:
    image: postgres:18-alpine
    container_name: healthybites-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthybites-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (ver .env.example)}
    ports:
      # 5433 porque 5432 suele estar ocupado por un PostgreSQL instalado en Windows.
      - "127.0.0.1:5433:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos en /var/lib/postgresql/<versión>/docker:
      # el volumen se monta en /var/lib/postgresql.
      - healthybites-pgdata-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthybites-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura todos los correos del entorno local: interfaz web en http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.33
    container_name: healthybites-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Almacenamiento S3 de pruebas (opcional, para probar STORAGE_TYPE=s3 y varias instancias en local):
  #   docker compose --profile s3 up -d s3
  #   STORAGE_TYPE=s3 S3_ENDPOINT=http://127.0.0.1:9090 S3_BUCKET=healthybites S3_ACCESS_KEY=local S3_SECRET_KEY=local
  # No comprueba las firmas ni guarda nada al borrar el contenedor: solo para desarrollo.
  s3:
    image: adobe/s3mock:5.2.3
    container_name: healthybites-s3
    profiles: ["s3"]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: healthybites
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  healthybites-pgdata-18:
