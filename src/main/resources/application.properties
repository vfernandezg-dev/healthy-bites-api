# Formulario de contacto de la landing page (POST /api/v1/contact)
# Buzon que recibe los mensajes; por defecto, la misma cuenta que envia los correos.
healthybites.contact.recipient=${CONTACT_RECIPIENT:${spring.mail.username}}
# Limites antiabuso: por IP y global (el global acota el total aunque se falsifique la IP).
healthybites.contact.rate-limit.per-client=5
healthybites.contact.rate-limit.per-client-window=PT10M
healthybites.contact.rate-limit.global=50
healthybites.contact.rate-limit.global-window=PT1H
