spring.application.name=healthy-bites
server.port=${SERVER_PORT:8090}
server.servlet.context-path=/api/v1
# Detras de un proxy (Render) usa X-Forwarded-For para conocer la IP real del cliente.
server.forward-headers-strategy=framework

# Configuracion de la base de datos
# Local Database Configuration (Postgres en Docker: ver docker-compose.yml, puerto 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/healthybites-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:adminadmin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Render Production Database Configuration (historico, la BD de Render ya no existe)
#spring.datasource.url=jdbc:postgresql://dpg-ct47og2j1k6c73eeo54g-a.oregon-postgres.render.com:5432/healthybites_db_v1
#spring.datasource.username=healthybites_v1
#spring.datasource.password=KIJlXMBDO70tSVBmINK48O1guupkZX95

# Propiedades de JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Datos de prueba: Hibernate crea/actualiza las tablas y DESPUES se ejecuta data-test.sql (idempotente).
# Para arrancar sin inyectar datos: DB_SEED_MODE=never
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_SEED_MODE:always}
spring.sql.init.data-locations=classpath:data-test.sql
spring.sql.init.encoding=UTF-8

# Configuracion de la URL de la documentacion de la API
healthybites.openapi.dev-url = http://localhost:8090/api/v1
healthybites.openapi.prod-url = https://healthybites-api-latest.onrender.com/api/v1

# Carpeta donde se guardaran los archivos multimedia
storage.location = mediafiles
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

