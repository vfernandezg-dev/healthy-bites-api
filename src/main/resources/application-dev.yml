# Perfil de desarrollo local. Se activa solo con `./mvnw spring-boot:run` (ver pom.xml).
#
# - Carga los secretos de .env (ignorado por git; copia .env.example).
# - spring-boot-docker-compose levanta PostgreSQL y Mailpit (docker-compose.yml) y conecta la BD sola.
# - Solo escucha en 127.0.0.1 y carga los datos de demostración.

spring:
  config:
    import: optional:file:.env[.properties]

  docker:
    compose:
      # Deja los contenedores en marcha al parar la aplicación (arranques más rápidos).
      lifecycle-management: start-only

  sql:
    init:
      mode: always

  # Mailpit (http://localhost:8025) recibe todos los correos: nada sale a Internet. Para probar con un SMTP
  # real, define MAIL_HOST, MAIL_PORT, MAIL_SMTP_AUTH y MAIL_STARTTLS en .env.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:dev@healthybites.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}

server:
  address: 127.0.0.1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

healthybites:
  app:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:4210}
    api-public-url: ${API_PUBLIC_URL:http://localhost:8090/api/v1}
