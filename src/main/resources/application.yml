# Configuración base de Healthy Bites API.
#
# Sirve tal cual para producción: los secretos llegan siempre de variables de entorno, sin valores por
# defecto (si falta alguno, la aplicación no arranca). El desarrollo local usa además application-dev.yml,
# que carga el fichero .env (ver .env.example).

spring:
  application:
    name: healthy-bites

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  # El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration); Hibernate solo comprueba que
  # las entidades coinciden con él.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      # Entre corchetes para conservar el "_" de la clave al enlazarla al mapa de propiedades de Hibernate.
      "[hibernate.format_sql]": true
      "[hibernate.jdbc.time_zone]": UTC

  flyway:
    locations: classpath:db/migration

  # Eventos entre módulos: se guardan en event_publication (lo crea la migración V1) hasta que su listener
  # termina; los que quedan a medias se reintentan al arrancar.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: delete
      republish-outstanding-events-on-restart: true

  threads:
    virtual:
      enabled: true

  # Paginación: ?page&size&sort, 20 por defecto y 100 como máximo.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        # Respuesta paginada estable ({content, page}) en vez de serializar PageImpl.
        serialization-mode: via-dto

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mail:
    default-encoding: UTF-8
    protocol: smtp
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    test-connection: false
    properties:
      mail:
        # mail.from y mail.smtp.localhost evitan que JavaMail resuelva el hostname de la máquina
        # (DNS inverso), que en algunos equipos tarda varios segundos por cada correo.
        from: ${spring.mail.username}
        smtp:
          auth: true
          localhost: localhost
          # Sin estos límites JavaMail espera indefinidamente si el servidor SMTP no responde.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true

server:
  port: ${PORT:8090}
  servlet:
    context-path: /api/v1
  # Tomcat solo acepta X-Forwarded-For de los proxies de confianza (por defecto, redes privadas), así que un cliente
  # no puede falsear su IP para esquivar los límites. Para un proxy con IP pública, define
  # SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (expresión regular).
  forward-headers-strategy: native

# Actuator: solo la salud (incluye /actuator/health/liveness y /readiness), sin detalles.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Sin comprobación del SMTP: conectaría con el servidor de correo en cada sonda, y una caída del correo no debe
    # sacar la API del balanceador.
    mail:
      enabled: false

# Swagger UI y /v3/api-docs solo en el perfil dev (y en los tests, que exportan docs/openapi.yaml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  # Salida estable: el contrato exportado solo cambia si cambia la API.
  writer-with-order-by-keys: true

healthybites:
  app:
    frontend-url: ${APP_FRONTEND_URL:}
    api-public-url: ${API_PUBLIC_URL:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      issuer: healthy-bites-api
      audience: healthy-bites-web
    refresh:
      idle-ttl: P7D
      absolute-ttl: P30D
      reuse-grace: PT20S
      cookie-name: __Secure-hb_rt
      cookie-secure: true
      cookie-path: /api/v1/auth
  # Orígenes permitidos (separados por comas). Sin valor, no se permite ninguna petición cruzada.
  cors:
    app-origins: ${CORS_APP_ORIGINS:}
    landing-origins: ${CORS_LANDING_ORIGINS:}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    api-base: ${PAYPAL_API_BASE:https://api-m.sandbox.paypal.com}
  storage:
    # Carpeta de los ficheros subidos (fuera del repo; nunca mediafiles/).
    location: ${STORAGE_LOCATION:uploads}
  openapi:
    contact-email: ${OPENAPI_CONTACT_EMAIL:projects@vfernandezg.dev}
  # Formulario de contacto de la landing page (POST /api/v1/contact)
  contact:
    # Buzón que recibe los mensajes; por defecto, la misma cuenta que envía los correos.
    recipient: ${CONTACT_RECIPIENT:${spring.mail.username}}
    # Límites antiabuso: por IP y global (el global acota el total aunque se falsifique la IP).
    rate-limit:
      per-client: 5
      per-client-window: PT10M
      global: 50
      global-window: PT1H
