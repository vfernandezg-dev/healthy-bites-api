<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta name="viewport" content="width=device-width" />
    <meta charset="UTF-8" />
    <title>Nuevo mensaje de contacto</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f7f5; font-family:Arial, sans-serif; color:#12261b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f7f5; padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:580px; background-color:#ffffff; border-radius:12px; overflow:hidden;">
                <tr>
                    <td style="background-color:#237047; padding:20px 28px; color:#ffffff; font-size:18px; font-weight:bold;">
                        Healthy Bites · Nuevo mensaje de contacto
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px; font-size:14px; line-height:1.6;">
                        <p style="margin:0 0 16px;">Se recibió un mensaje desde el formulario de la landing page.</p>
                        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
                            <tr>
                                <td style="padding:2px 16px 2px 0; color:#4b5d52;">Nombre</td>
                                <td style="padding:2px 0; font-weight:bold;"
                                    th:text="${nombre + ' ' + apellido}">Nombre Apellido</td>
                            </tr>
                            <tr>
                                <td style="padding:2px 16px 2px 0; color:#4b5d52;">Correo</td>
                                <td style="padding:2px 0; font-weight:bold;" th:text="${correo}">correo@ejemplo.com</td>
                            </tr>
                        </table>
                        <!-- th:text escapa el HTML: el contenido del visitante nunca se interpreta como marcado. -->
                        <div style="padding:16px; background-color:#effaf3; border-radius:8px; white-space:pre-line;"
                             th:text="${mensaje}">Mensaje</div>
                        <p style="margin:20px 0 0; color:#4b5d52; font-size:12px;">
                            Responde a este correo para contestar directamente al remitente.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
